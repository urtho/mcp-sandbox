[server]
# Server configuration
host = "0.0.0.0"
port = 8181

[sandbox]
# Global cap on simultaneously existing sandboxes (per-process)
global_sandbox_limit = 50

[docker]
# Default Docker image name
default_image = "python-sandbox:latest"
# Dockerfile path
dockerfile_path = "sandbox_images/Dockerfile"
# Whether to check for Dockerfile changes and rebuild if needed
check_dockerfile_changes = true
# File to store last build information
build_info_file = ".docker_build_info"
# Idle timeout for a sandbox container in seconds (containers untouched for this long are removed)
sandbox_idle_timeout_seconds = 1800

[logging]
# Logging configuration
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_file = "mcp_sandbox.log"

[mirror]
pypi_index_url = "https://mirrors.aliyun.com/pypi/simple/"